<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de pasos - Mi Recetario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Mi Recetario
        </a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">
            Inicio
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success">Pasos de preparación</h1>

        <a th:href="@{/pasos/nuevo}" class="btn btn-success">
            + Nuevo paso
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">

                    <thead class="table-success">
                        <tr>
                            <th>ID</th>
                            <th>Receta</th>
                            <th>Número de paso</th>
                            <th>Instrucciones</th>
                            <th>Duración (min)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="paso : ${pasos}">
                            <td th:text="${paso.id}"></td>

                            <td th:text="${paso.receta.nombre}"></td>

                            <td th:text="${paso.numeroPaso}"></td>

                            <td th:text="${paso.instrucciones}"></td>

                            <td th:text="${paso.duracionMinutos}"></td>

                            <td>
                                <a th:href="@{/pasos/editar/{id}(id=${paso.id})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{/pasos/eliminar/{id}(id=${paso.id})}"
                                   class="btn btn-danger btn-sm">
                                    Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(pasos)}">
                            <td colspan="6"
                                class="text-center text-secondary py-4">
                                Todavía no hay pasos registrados.
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Volver al inicio
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
