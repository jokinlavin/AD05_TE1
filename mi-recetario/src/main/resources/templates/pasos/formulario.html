<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de paso - Mi Recetario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Mi Recetario
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">
                    <h1 class="h4 mb-0"
                        th:text="${paso.id == null ? 'Nuevo paso' : 'Editar paso'}">
                        Nuevo paso
                    </h1>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/pasos/guardar}"
                          th:object="${paso}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="receta" class="form-label">
                                Receta asociada *
                            </label>

                            <select id="receta"
                                    class="form-select"
                                    th:field="*{receta.id}"
                                    th:classappend="${#fields.hasErrors('receta')} ? 'is-invalid' : ''"
                                    required>

                                <option value="">
                                    Selecciona una receta
                                </option>

                                <option th:each="receta : ${recetas}"
                                        th:value="${receta.id}"
                                        th:text="${receta.nombre}">
                                </option>

                            </select>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('receta')}"
                                 th:errors="*{receta}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="numeroPaso" class="form-label">
                                Número de paso *
                            </label>

                            <input type="number"
                                   id="numeroPaso"
                                   th:field="*{numeroPaso}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('numeroPaso')} ? 'is-invalid' : ''"
                                   min="1"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('numeroPaso')}"
                                 th:errors="*{numeroPaso}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="instrucciones" class="form-label">
                                Instrucciones *
                            </label>

                            <textarea id="instrucciones"
                                      th:field="*{instrucciones}"
                                      class="form-control"
                                      th:classappend="${#fields.hasErrors('instrucciones')} ? 'is-invalid' : ''"
                                      rows="4"
                                      maxlength="1000"
                                      placeholder="Describe qué hay que hacer en este paso..."
                                      required>
                            </textarea>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('instrucciones')}"
                                 th:errors="*{instrucciones}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="duracionMinutos" class="form-label">
                                Duración (minutos) *
                            </label>

                            <input type="number"
                                   id="duracionMinutos"
                                   th:field="*{duracionMinutos}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('duracionMinutos')} ? 'is-invalid' : ''"
                                   min="0"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('duracionMinutos')}"
                                 th:errors="*{duracionMinutos}">
                            </div>
                        </div>

                        <p class="text-secondary small">
                            * Campos obligatorios.
                        </p>

                        <div class="d-flex gap-2">

                            <button type="submit" class="btn btn-success">
                                Guardar paso
                            </button>

                            <a th:href="@{/pasos}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
