<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de recetas - Mi Recetario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            Mi Recetario
        </a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">
            Inicio
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-success">Mis recetas</h1>
        <a th:href="@{/recetas/nueva}" class="btn btn-success">
            + Nueva receta
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">

                    <thead class="table-success">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Tipo de cocina</th>
                            <th>Tiempo (min)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="receta : ${recetas}">
                            <td th:text="${receta.id}"></td>
                            <td th:text="${receta.nombre}"></td>
                            <td th:text="${receta.descripcion}"></td>
                            <td th:text="${receta.tipoCocina}"></td>
                            <td th:text="${receta.tiempoPreparacion}"></td>

                            <td>
                                <a th:href="@{/recetas/editar/{id}(id=${receta.id})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{/recetas/eliminar/{id}(id=${receta.id})}"
                                   class="btn btn-danger btn-sm">
                                    Eliminar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(recetas)}">
                            <td colspan="6" class="text-center text-secondary py-4">
                                Todavía no hay recetas registradas.
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Volver al inicio
        </a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
